<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Dark Industrial Background -->
  <rect width="64" height="64" rx="14" fill="#0E131A"/>
  <!-- Metallic Tank Body -->
  <rect x="18" y="16" width="28" height="34" rx="4" fill="url(#metalGrad)" stroke="#94A3B8" stroke-width="2"/>
  <!-- Tank Domed Top -->
  <path d="M18 18 C18 10, 46 10, 46 18 Z" fill="url(#topGrad)" stroke="#94A3B8" stroke-width="1.5"/>
  <!-- Tank Domed Bottom / Stand -->
  <path d="M18 48 C18 52, 46 52, 46 48" stroke="#64748B" stroke-width="2" stroke-linecap="round"/>
  <!-- Tank Welded Seam Lines -->
  <line x1="18" y1="27" x2="46" y2="27" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="2 1"/>
  <line x1="18" y1="38" x2="46" y2="38" stroke="#64748B" stroke-width="1.5"/>
  <!-- Welding Spark / Arc -->
  <circle cx="44" cy="27" r="3.5" fill="#38BDF8" filter="url(#glow)"/>
  <circle cx="44" cy="27" r="1.5" fill="#FFFFFF"/>
  <!-- Tank Legs -->
  <line x1="22" y1="50" x2="20" y2="58" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="32" y1="50" x2="32" y2="58" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="42" y1="50" x2="44" y2="58" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round"/>

  <defs>
    <linearGradient id="metalGrad" x1="18" y1="16" x2="46" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="35%" stop-color="#94A3B8"/>
      <stop offset="60%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="topGrad" x1="18" y1="10" x2="46" y2="18" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#64748B"/>
      <stop offset="50%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <filter id="glow" x="36" y="19" width="16" height="16" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
</svg>